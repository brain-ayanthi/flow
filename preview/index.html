function taxPage(){const rateRows=taxRates.map(r=>({...r,calculation:r.calculation_type==='percentage'?'Percentage':'Fixed amount',display_rate:r.calculation_type==='percentage'?`${Number(r.rate).toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}%`:money(r.rate),groups:taxGroups.filter(g=>g.rateIds.includes(r.id)).map(g=>g.name).join(', ')||'—'}));const groupRows=taxGroups.map(g=>({...g,mode:g.is_inclusive?'Tax-inclusive':'Tax-exclusive',rates:g.rateIds.map(id=>taxRates.find(r=>r.id===id)?.name).filter(Boolean).join(' + '),status:g.is_active?'Active':'Inactive'}));return `${head('Tax Rates & Groups','Configure tax rates, tax groups, and inclusive or exclusive pricing for this business.',`<button class="btn" data-action="tax-add-rate">＋ New tax rate</button><button class="btn primary" data-action="tax-add-group">＋ New tax group</button>`)}<div class="demo-flag">Taxes are configured per business. Tax group and rate snapshots will be stored on finalized purchases and invoices, so later tax changes will not rewrite old records. Sample rates below are for interface preview only—confirm applicable tax rules before use.</div><section class="card"><div class="item-tabs"><button class="item-tab ${taxTab==='rates'?'active':''}" data-tax-tab="rates">Tax Rates <span class="nav-count">${taxRates.length}</span></button><button class="item-tab ${taxTab==='groups'?'active':''}" data-tax-tab="groups">Tax Groups <span class="nav-count">${taxGroups.length}</span></button><button class="item-tab ${taxTab==='calculator'?'active':''}" data-tax-tab="calculator">Tax Calculator</button></div><div class="card-body">${taxTab==='rates'?`<div class="table-tools" style="justify-content:space-between;margin-bottom:12px"><div><strong style="font-size:10px">Tax rates</strong><div style="font-size:8px;color:var(--muted);margin-top:4px">Rate, type, effective dates and group usage.</div></div><button class="btn sm primary" data-action="tax-add-rate">＋ Add rate</button></div>${tableHtml([{label:'Code',key function renderCustomerStep(){const selected=customers.find(c=>String(c.id)===String(draft.customerId));return `<div class="wizard-section-title">Step 1: Customer Information</div><div class="customer-step"><div class="customer-fields"><div class="field wide"><label>Select Customer *</label><div class="customer-control"><select class="select" data-draft="customerId"><option value="">Choose a customer…</option>${customers.map(c=>`<option value="${c.id}" ${String(c.id)===String(draft.customerId)?'selected':''}>${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}</select><button class="square-add" data-action="add-customer" title="Add customer">＋</button></div></div><div class="field"><label>Order By Name</label><input class="input" data-draft="orderBy" value="${esc(draft.orderBy||selected?.name||'')}"></div><div class="field"><label>Mobile Number *</label><input class="input" data-draft="phone" value="${esc(draft.phone||selected?.phone||'')}"></div><div class="field wide"><label>WhatsApp Number</label><input class="input" data-draft="whatsapp" value="${esc(draft.whatsapp||selected?.whatsapp||'')}"></div></div><div class="field"><label>Job Date</label><input class="input" type="date" data-draft="date" value="${esc(draft.date)}"><label style="margin-top:4px">Delivery Date *</label><input class="input" type="date" data-draft="due" value="${esc(draft.due)}"></div><div class="outstanding-wrap"><label style="display:block;font-size:8px;font-weight:800;margin:3px 0 6px">Previous Bill Details (Outstanding)</label><div class="outstanding-box"><div class="outstanding-table"><b>Date</b><b>Bill #</b><b>Balance</b></div>${selected?.balance?`<div class="outstanding-table"><span>28 Aug 2026</span><span>INV-2405</span><span>${money(selected.balance)}</span></div>`:`<div class="empty" style="padding:30px">${selected?'No outstanding bills for this customer.':'Select a customer to view outstanding bills.'}</div>`}</div></div></div>`}
function optionsFor(field,value=''){const choices={fabrication:['Select','Eyelet','Hemming','Mounting','Laminate'],unit:['Sq Ft','Piece','Roll'],particular:['Select particular','Business Card','Flyer A5','Poster A3','Sticker Sheet'],side:['Single side','Both sides'],itemName:['Select item','Transport','Installation','Design charges','Other']};return (choices[field]||['Select']).map((option,i)=>{const val=(i===0&&['fabrication','particular','itemName'].includes(field))?'':option;return `<option value="${esc(val)}" ${String(value)===String(val)?'selected':''}>${esc(option)}</option>`}).join('')}
function itemInput(category,index,[key,label,type],item){const value=item[key]??'';if(type==='readonly')return `<td class="calc-cell" data-calc="${key}" data-index="${index}">${esc(value||'0.00')}</td>`;if(type==='select')return `<td><select data-line="${category}" data-index="${index}" data-field="${key}">${optionsFor(key,value)}</select></td>`;return `<td><input class="${['media','remark','itemName','particular'].includes(key)?'item-wide':''}" ${type==='number'?'type="number" min="0" step="0.01"':''} placeholder="${esc(label)}" value="${esc(value)}" data-line="${category}" data-index="${index}" data-field="${key}"></td>`}
function renderItemsStep(){const category=jobTab,rows=draft.items[category]||[],schema=itemSchemas[category];return `<div class="item-tabs"><button class="item-tab ${category==='flex'?'active':''}" data-item-tab="flex">${esc(tr('Flex Items'))}<span class="tab-count">${draft.items.flex.length}</span></button><button class="item-tab ${category==='digital'?'active':''}" data-item-tab="digital">${esc(tr('Digital/Paper Items'))}<span class="tab-count">${draft.items.digital.length}</span></button><button class="item-tab ${category==='other'?'active':''}" data-item-tab="other">${esc(tr('Other Items'))}<span class="tab-count">${draft.items.other.length}</span></button><div class="item-toolbar"><button class="btn cyan sm" data-action="add-item">＋ ${esc(tr('Add Item'))}</button></div></div><div class="items-scroll"><table class="items-table"><thead><tr>${schema.map(s=>`<th>${esc(s[1])}</th>`).join('')}<th>#</th></tr></thead><tbody>${rows.length?rows.map((item,index)=>`<tr>${schema.map(s=>itemInput(category,index,s,item)).join('')}<td><button class="item-remove" data-action="remove-item" data-index="${index}" data-category="${category}">×</button></td></tr>`).join(''):`<tr><td colspan="${schema.length+1}" class="empty">No ${category==='flex'?'flex':category==='digital'?'digital/paper':'other'} items yet. Choose “Add Item” to start this line.</td></tr>`}</tbody></table></div><div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px"><span class="task-note">For flex items, area is calculated in sq ft from billing width × height.</span><b style="font-size:9px">Current subtotal: <span id="itemsSubtotal">${money(draftSubtotal())}</span></b></div>`}
function lineTotal(cat,item){const qty=Number(item.qty||0),rate=Number(item.rate||0);if(cat==='flex'){const w=Number(item.bw||item.w||0),h=Number(item.bh||item.h||0);const area=(w*h)/144;return {area,total:area*qty*rate}}return {area:0,total:qty*rate}}
function draftSubtotal(){let sum=0;for(const cat of Object.keys(draft.items))for(const item of draft.items[cat])sum+=lineTotal(cat,item).total;return Math.round(sum*100)/100}
function refreshItemTotals(){document.querySelectorAll('[data-calc="total"]').forEach(el=>{const item=draft.items[el.closest('tr')?.querySelector('[data-line]')?.dataset.line]?.[Number(el.dataset.index)];if(item)el.textContent=money(lineTotal(el.closest('tr').querySelector('[data-line]').dataset.line,item).total)});document.querySelectorAll('[data-calc="area"]').forEach(el=>{const cat=el.closest('tr')?.querySelector('[data-line]')?.dataset.line;const item=draft.items[cat]?.[Number(el.dataset.index)];if(item)el.textContent=lineTotal(cat,item).area.toFixed(2)});const sub=$('#itemsSubtotal');if(sub)sub.textContent=money(draftSubtotal());const bill=$('#billingSubtotal');if(bill)updateBillingNumbers()}
function renderBillingStep(){return `<div class="wizard-section-title">Step 3: Billing &amp; Finalization</div><div class="billing-grid"><div><label style="font-size:8px;font-weight:800;display:block;margin:2px 0 7px">Billing Summary</label><div class="summary-rows"><div class="sum-row"><span>Total Bill / Subtotal</span><strong id="billingSubtotal">${money(draftSubtotal())}</strong></div><div class="sum-row"><span>Discount</span><input class="input" style="max-width:100px;height:25px;text-align:right" type="number" min="0" step="0.01" data-draft="discount" value="${esc(draft.discount)}"></div><div class="sum-row"><span>Sub Total</span><strong id="billingAfterDiscount">${money(Math.max(0,draftSubtotal()-Number(draft.discount||0)))}</strong></div><div class="sum-row"><span>Round Off</span><input class="input" style="max-width:100px;height:25px;text-align:right" type="number" step="0.01" data-draft="roundOff" value="${esc(draft.roundOff)}"></div><div class="sum-row final"><span>Final Bill</span><strong id="billingFinal">${money(finalBill())}</strong></div><div class="sum-row advance"><span>Advance Received</span><input class="input" style="max-width:120px;height:25px;text-align:right" type="number" min="0" step="0.01" data-draft="advance" value="${esc(draft.advance)}"></div></div><div class="sum-row balance"><span>Outstanding Balance</span><strong id="billingBalance">${money(balanceDue())}</strong></div></div><div><div class="payment-box"><h4>Receive Advance &amp; Generate Receipt</h4><div class="billing-fields"><div class="field"><label>Payment Mode</label><select class="select" data-draft="mode"><option>Cash</option><option>Bank Transfer</option><option>Card</option><option>Cheque</option></select></div><div class="field"><label>Deposit Account</label><select class="select" data-draft="deposit"><option>Cash in Hand</option><option>Commercial Bank</option></select></div><div class="field full"><label>Reference No.</label><input class="input" placeholder="Bank / cheque function finalBill(){return Math.max(0,draftSubtotal()-Number(draft.discount||0)+Number(draft.roundOff||0))}
function balanceDue(){return Math.max(0,finalBill()-Number(draft.advance||0))}
function updateBillingNumbers(){for(const [id,val] of [['billingSubtotal',draftSubtotal()],['billingAfterDiscount',Math.max(0,draftSubtotal()-Number(draft.discount||0))],['billingFinal',finalBill()],['billingBalance',balanceDue()]]){const el=$('#'+id);if(el)el.textContent=money(val)}}
function customerModal(){openModal(`<div class="modal-head"><div><h3>Add Customer</h3><p>Create a customer record in this print shop workspace.</p></div><button class="close" data-action="close-modal">×</button></div><form id="customerForm"><div class="modal-body"><div class="settings-form"><div class="field"><label>Customer name *</label><input class="input" name="name" required></div><div class="field"><label>Customer type</label><select class="select" name="type"><option>Regular Customer</option><option>Business</option><option>One-time customer</option></select></div><div class="field"><label>Mobile number *</label><input class="input" name="phone" required></div><div class="field"><label>WhatsApp number</label><input class="input" name="whatsapp"></div><div class="field"><label>Email</label><input class="input" type="email" name="email"></div><div class="field"><label>Customer limit (LKR)</label><input class="input" type="number" name="credit" value="0"></div><div class="field full"><label>Address *</label><textarea class="textarea" name="address" required></textarea></div></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Add Customer</button></div></form>`)}
function transactionModal(kind){const isReceipt=kind==='receipt',title=isReceipt?'Receive Customer Receipt':'Record Payment';openModal(`<div class="modal-head"><div><h3>${title}</h3><p>${isReceipt?'Record a customer receipt against an invoice.':'Record a payment made to a supplier or expense.'}</p></div><button class="close" data-action="close-modal">×</button></div><form id="transactionForm" data-kind="${kind}"><div class="modal-body"><div class="settings-form"><div class="field"><label>${isReceipt?'Customer':'Payee'} *</label><select class="select" name="party" required><option value="">Select…</option>${(isReceipt?customers.map(c=>c.name):['Lanka Paper Traders','Flex Supply Co.','Ink House','Other']).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Amount (LKR) *</label><input class="input" name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Payment mode</label><select class="select" name="mode"><option>Cash</option><option>Bank transfer</option><option>Card</option><option>Cheque</option></select></div><div class="field"><label>Reference / Invoice No.</label><input class="input" name="reference" placeholder="e.g. INV-2408"></div><div class="field full"><label>Note</label><input class="input" name="note" placeholder="Optional remark"></div></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">${isReceipt?'Save receipt':'Save payment'}</button></div></form>`)}
function openModal(html){$('#modal').innerHTML=html;$('#backdrop').classList.add('open');document.body.style.overflow='hidden';$('#modal input')?.focus()}
function closeModal(){$('#backdrop').classList.remove('open');document.body.style.overflow=''}
function renderPage(){let html='';if(page==='dashboard')html=dashboard();else if(page==='new-job')html=newJobPage();else if(page==='job-status')html=statusBoard();else if(page==='reports')html=reportsPage();else if(page==='taxes')html=taxPage();else if(page==='settings')html=settingsPage();else if(page==='master-data')html=masterDataPage();else html=genericList(page);$('#content').innerHTML=html;$('#nav').innerHTML=navHtml();$('#crumb').textContent=pageName(page);document.documentElement.lang=lang;}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function startJob(){draft={customerId:'',orderBy:'',phone:'',whatsapp:'',date:new Date().toISOString().slice(0,10),due:new Date(Date.now()+3*86400000).toISOString().slice(0,10),discount:0,roundOff:0,advance:0,mode:'Cash',deposit:'Cash in Hand',comment:'',sendWhatsApp:true,generateInvoice:true,items:{flex:[],digital:[],other:[]}};newJobStep=1;jobTab='flex';page='new-job';renderPage()}
function saveJob(){const customer=customers.find(c=>String(c.id)===String(draft.customerId));const allLines=Object.entries(draft.items).flatMap(([cat,items])=>items.map(item=>({cat,item}))).filter(x=>x.item.itemName||x.item.media||x.item.particular||x.item.w||x.item.qty);const amount=finalBill();if(!customer){toast('Select a customer before saving.');newJobStep=1;renderPage();return}if(!allLines.length||amount<=0){toast('Add at least one priced job item before saving.');newJobStep=2;renderPage();return}const ref='JOB-'+String(225+jobs.length).padStart(6,'0');const subject=allLines.map(x=>x.item.itemName||x.item.particular||x.item.media||'Print item').slice(0,2).join(' + ');jobs.unshift({ref,item:ref+'-01',customer:customer.name,contact:draft.phone||customer.phone,subject,type:allLines[0].cat==='flex'?'Flex':allLines[0].cat==='digital'?'Digital':'Other',priority:'Normal',start:draft.date,due:draft.due,duration:'3 days',status:'Pending',amount});if(draft.generateInvoice){invoices.unshift({ref:'INV-'+String(2409+invoices.length),customer:customer.name,phone:customer.phone,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),amount,balance:balanceDue(),tds:0,job:ref,status:balanceDue()===0?'Paid':'Pending'})}page='job-cards';renderPage();toast('Jobcard '+ref+' saved in this demo preview.');}
function customerSearchFilter(input){const val=input.value.toLowerCase();const rows=$$('#genericTable tbody tr');rows.forEach(row=>row.style.display=row.textContent.toLowerCase().includes(val)?'':'none')}
function $$(selector,root=document){return Array.from(root.querySelectorAll(selector))}
function addItem(){draft.items[jobTab].push({});renderPage()}
function updateDraftField(target){const key=target.dataset.draft;if(!key)return;if(target.type==='checkbox')draft[key]=target.checked;else draft[key]=target.value;if(key==='customerId'){const c=customers.find(x=>String(x.id)===String(draft.customerId));draft.orderBy=c?.name||'';draft.phone=c?.phone||'';draft.whatsapp=c?.whatsapp||'';renderPage();return}if(['discount','roundOff','advance'].includes(key))updateBillingNumbers()}
function updateLineField(target){const cat=target.dataset.line,index=Number(target.dataset.index),field=target.dataset.field;if(!cat||!field||!draft.items[cat][index])return;draft.items[cat][index][field]=target.value;const row=target.closest('tr');const calc=lineTotal(cat,draft.items[cat][index]);const area=row?.querySelector('[data-calc="area"]');const total=row?.querySelector('[data-calc="total"]');if(area)area.textContent=calc.area.toFixed(2);if(total)total.textContent=money(calc.total);refreshItemTotals()}
function attendanceTab(name){toast(name+' view selected.');}
function genericAdd(){openModal(`<div class="modal-head"><div><h3>Add ${esc(pageName(page).replace(/s$/,''))}</h3><p>Quick-create form for this preview.</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="field"><label>Name / reference *</label><input class="input" id="genericName" placeholder="Enter a name"></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea class="textarea" placeholder="Optional details"></textarea></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-generic">Save</button></div>`)}
function taxModal(kind){if(kind==='rate'){openModal(`<div class="modal-head"><div><h3>New Tax Rate</h3><p>Create one reusable rate for this business; apply it through a tax group.</p></div><button class="close" data-action="close-modal">×</button></div><form id="taxForm" data-kind="rate"><div class="modal-body"><div class="settings-form"><div class="field"><label>Tax name *</label><input class="input" name="name" required placeholder="e.g. VAT"></div><div class="field"><label>Code *</label><input class="input" name="code" required placeholder="e.g. VAT18"></div><div class="field"><label>Calculation type</label><select class="select" name="calculation_type"><option value="percentage">Percentage</option><option value="fixed">Fixed amount per unit</option></select></div><div class="field"><label>Rate *</label><input class="input" type="number" name="rate" min="0" step="0.0001" required placeholder="18.0000"></div><div class="field"><label>Valid from</label><input class="input" type="date" name="valid_from"></div><div class="field"><label>Valid until</label><input class="input" type="date" name="valid_until"></div><div class="field full"><label><input type="checkbox" name="is_compound"> Compound tax (this rate applies after earlier rates)</label></div></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save tax rate</button></div></form>`);return}openModal(`<div class="modal-head"><div><h3>New Tax Group</h3><p>Combine tax rates and choose inclusive or exclusive pricing.</p></div><button class="close" data-action="close-modal">×</button></div><form id="taxForm" data-kind="group"><div class="modal-body"><div class="settings-form"><div class="field"><label>Group name *</label><input class="input" name="name" required placeholder="Standard VAT"></div><div class="field"><label>Code *</label><input class="input" name="code" required placeholder="STD-VAT"></div><div class="field full"><label>Included tax rates *</label><div class="tax-rate-checks">${taxRates.filter(r=>r.is_active).map(r=>`<label><input type="checkbox" name="tax_rate_ids" value="${r.id}"> ${esc(r.name)} · ${r.calculation_type==='percentage'?`${r.rate}%`:`LKR ${r.rate}`}</label>`).join('')}</div></div><div class="field full"><label><input type="checkbox" name="is_inclusive"> Product prices already include this tax</label></div><div class="field full"><label>Description</label><textarea class="textarea" name="description" placeholder="Optional"></textarea></div></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save tax group</button></div></form>`)}
function taxPreviewDemo(){const group=taxGroups.find(g=>String(g.id)===$('#taxPreviewGroup')?.value),amount=Number($('#taxPreviewAmount')?.value||0),qty=Number($('#taxPreviewQty')?.value||1);if(!group||amount<0||qty<=0){toast('Choose a group and valid amount/quantity.');return}const rates=group.rateIds.map(id=>taxRates.find(r=>r.id===id)).filter(r=>r&&r.is_active);const partsFor=base=>{let running=base;const parts=rates.map(r=>{const v=r.calculation_type==='fixed'?Number(r.rate)*qty:(r.is_compound?running:base)*Number(r.rate)/100;if(r.is_compound)running+=v;return {name:r.name,amount:v}});return parts};let taxable=amount,parts=partsFor(amount);if(group.is_inclusive){let low=0,high=amount;for(let i=0;i<60;i++){const mid=(low+high)/2;if(mid+partsFor(mid).reduce((a,p)=>a+p.amount,0)>amount)high=mid;else low=mid}taxable=Math.round(((low+high)/2)*100)/100;parts=partsFor(taxable);const totalTax=Math.round((amount-taxable)*100)/100;let diff=Math.round((totalTax-parts.reduce((a,p)=>a+Math.round(p.amount*100)/100,0))*100)/100;if(parts.length)parts[parts.length-1].amount=Math.round((Math.round(parts[parts.length-1].amount*100)/100+diff)*100)/100}else parts=parts.map(p=>({...p,amount:Math.round(p.amount*100)/100}));const tax=group.is_inclusive?Math.round((amount-taxable)*100)/100:parts.reduce((a,p)=>a+p.amount,0),total=group.is_inclusive?amount:taxable+tax;$('#taxPreviewResult').innerHTML=`<strong>Calculated amount</strong><div class="tax-result-row"><span>Taxable amount</span><b>${money(taxable)}</b></div>${parts.map(p=>`<div class="tax-result-row"><span>${esc(p.name)}</span><b>${money(p.amount)}</b></div>`).join('')}<div class="tax-result-row tax-result-total"><span>Tax total</span><b>${money(tax)}</b></div><div class="tax-result-row tax-result-total"><span>Invoice total</span><b>${money(total)}</b></div><small>Preview only · Laravel recalculates and snapshots tax at finalization.</small>`}
function currentCustomersPage(){page='customers';renderPage()}
function renderAccountingPage(id){return accountingPage(id)}
function init(){renderPage()}

document.addEventListener('click',e=>{
 const pageBtn=e.target.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;tableQuery='';renderPage();$('#sidebar').classList.remove('open');return}
 const itemTab=e.target.closest('[data-item-tab]');if(itemTab){jobTab=itemTab.dataset.itemTab;renderPage();return}
  const taxSwitch=e.target.closest('[data-tax-tab]');if(taxSwitch){taxTab=taxSwitch.dataset.taxTab;renderPage();return}
  const setting=e.target.closest('[data-setting-tab]');if(setting){settingsTab=setting.dataset.settingTab;renderPage();return}
 const att=e.target.closest('[data-att-tab]');if(att){$$('[data-att-tab]').forEach(x=>x.classList.toggle('active',x===att));attendanceTab(att.dataset.attTab);return}
 const report=e.target.closest('[data-report]');if(report){toast(report.dataset.report+' report selected.');return}
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='new-job'){startJob();return}if(action==='quick-payment'){transactionModal('payment');return}if(action==='quick-receipt'){transactionModal('receipt');return}if(action==='close-modal'){closeModal();return}if(action==='add-customer'){customerModal();return}if(action==='job-next'){if(newJobStep===1&&!draft.customerId){toast('Select a customer to continue.');return}newJobStep=Math.min(3,newJobStep+1);renderPage();return}if(action==='job-prev'){newJobStep=Math.max(1,newJobStep-1);renderPage();return}if(action==='cancel-job'){if(confirm('Discard this jobcard?')){page='dashboard';renderPage()}return}if(action==='add-item'){addItem();return}if(action==='remove-item'){draft.items[e.target.closest('[data-category]')?.dataset.category||e.target.dataset.category].splice(Number(e.target.dataset.index),1);renderPage();return}if(action==='save-job'){saveJob();return}
 if(action==='tax-add-rate'){taxModal('rate');return}if(action==='tax-add-group'){taxModal('group');return}if(action==='tax-calc'){taxPreviewDemo();return}if(action==='save-settings'){toast('Settings saved in this preview only.');return}if(action==='generic-add'){genericAdd();return}if(action==='save-generic'){closeModal();toast('Saved in the preview only.');return}if(action==='export'){toast('Export action will be connected to Laravel reporting.');return}if(action==='print'){window.print();return}if(action==='filter'){toast('Filters applied to the preview.');return}if(action==='import'){toast('Choose a CSV/XLS file when the import workflow is connected.');return}if(action==='add-task'){toast('Task added to the follow-up queue (preview).');return}if(action==='row-menu'){toast('Record actions: View · Edit · Print');return}
});
document.addEventListener('input',e=>{if(e.target.dataset.draft!==undefined)updateDraftField(e.target);if(e.target.dataset.line!==undefined)updateLineField(e.target);if(e.target.dataset.pageSearch!==undefined){const q=e.target.value.toLowerCase();$$('#genericTable tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}if(e.target.dataset.boardSearch!==undefined){const q=e.target.value.toLowerCase();$$('.job-mini').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}});
document.addEventListener('change',e=>{if(e.target.id==='language'){lang=e.target.value;renderPage();toast('Language preview changed.');return}if(e.target.dataset.draft!==undefined)updateDraftField(e.target);if(e.target.dataset.line!==undefined)updateLineField(e.target)});
document.addEventListener('submit',e=>{if(e.target.id==='customerForm'){e.preventDefault();const fd=new FormData(e.target);const customer={id:Date.now(),name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),whatsapp:String(fd.get('whatsapp')||fd.get('phone')).trim(),email:String(fd.get('email')||''),address:String(fd.get('address')||''),balance:0};customers.push(customer);if(page==='new-job'){draft.customerId=customer.id;draft.orderBy=customer.name;draft.phone=customer.phone;draft.whatsapp=customer.whatsapp}closeModal();renderPage();toast('Customer added in this demo preview.')}else if(e.target.id==='transactionForm'){e.preventDefault();const fd=new FormData(e.target),kind=e.target.dataset.kind,amount=Number(fd.get('amount')||0),date=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});if(kind==='receipt')receipts.unshift({ref:'REC-'+String(641+receipts.length).padStart(5,'0'),date,customer:String(fd.get('party')),invoice:String(fd.get('reference')||'—'),amount,mode:String(fd.get('mode'))});else payments.unshift({ref:'PAY-'+String(1085+payments.length).padStart(5,'0'),date,payee:String(fd.get('party')),amount,mode:String(fd.get('mode')),remark:String(fd.get('note')||fd.get('reference')||'—'),user:'Demo User'});closeModal();renderPage();toast((kind==='receipt'?'Receipt':'Payment')+' saved in the demo preview.')}});
document.addEventListener('submit',e=>{if(e.target.id!=='taxForm')return;e.preventDefault();const fd=new FormData(e.target),kind=e.target.dataset.kind,code=String(fd.get('code')||'').trim().toUpperCase(),name=String(fd.get('name')||'').trim();if(kind==='rate'){if(taxRates.some(r=>r.code.toUpperCase()===code)){toast('That tax code already exists in this demo.');return}taxRates.push({id:Date.now(),code,name,calculation_type:String(fd.get('calculation_type')),rate:Number(fd.get('rate')||0),is_compound:fd.has('is_compound'),valid_from:String(fd.get('valid_from')||''),valid_until:String(fd.get('valid_until')||''),is_active:true});closeModal();renderPage();toast('Tax rate saved in this preview only.');return}const rateIds=fd.getAll('tax_rate_ids').map(Number);if(!rateIds.length){toast('Choose at least one tax rate.');return}if(taxGroups.some(g=>g.code.toUpperCase()===code)){toast('That tax group code already exists in this demo.');return}taxGroups.push({id:Date.now(),code,name,is_inclusive:fd.has('is_inclusive'),is_active:true,rateIds});closeModal();renderPage();toast('Tax group saved in this preview only.')});
$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});$('#alerts').addEventListener('click',()=>toast('You are all caught up.'));$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){tableQuery=e.target.value;page='job-cards';renderPage();const input=$('[data-page-search]');if(input){input.value=tableQuery;input.dispatchEvent(new Event('input'))}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});
init();
